name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry/aviator2277/modules/wpilib-sim
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: fmt
        run: terraform fmt -check -diff
      - name: init
        run: terraform init -backend=false
      - name: validate
        run: terraform validate
      - name: test
        run: terraform test -verbose
      - name: shellcheck
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1083/SC2154: ${VAR} tokens belong to terraform templatefile, not shell.
          shellcheck -e SC1083,SC2154 registry/aviator2277/modules/wpilib-sim/run.sh spike/entry.sh

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/template
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: init
        run: terraform init -backend=false
      - name: validate
        run: terraform validate

  # Runs the module's bun tests inside the coder/registry harness (which provides
  # the ~test utilities). Needs Docker with --network=host: native on this runner.
  bun-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: this
      - uses: actions/checkout@v4
        with:
          repository: coder/registry
          path: registry
      - uses: oven-sh/setup-bun@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false
      - name: install module into harness
        run: |
          mkdir -p registry/registry/aviator2277/modules
          cp -r this/registry/aviator2277/modules/wpilib-sim registry/registry/aviator2277/modules/
      - name: bun install
        working-directory: registry
        run: bun install
      - name: bun test
        working-directory: registry
        run: bun test registry/aviator2277/modules/wpilib-sim/main.test.ts

  # Validates the workspace image builds on amd64 (prod arch). The multi-arch
  # build-and-push (amd64+arm64) is done manually or once registry secrets are
  # configured — the arm64 leg runs Gradle under QEMU and is slow by nature.
  image-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        run: docker buildx build --platform linux/amd64 -t wpilib-workspace:ci images/
